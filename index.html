<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Javascript</title>
</head>
<body>

    <h2>Praktikum Basic Javascript</h2>
    <p>Lihat hasil melalui console (F12)</p>

    <script>
        const nama = "Zidane";
        let umur = 20;
        let nilai = 90
        let aktif = true

        console.log("Nama:", nama);
        console.log("Umur:", umur);
        console.log("Nilai:", nilai);
        console.log("Status Aktif:", aktif);
        console.log("Tipe Nilai:", typeof nilai);

        const tugas = 90
        const uts = 95
        const uas = 85
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("Nilai Akhir:", akhir);
        console.log("Lulus:", akhir >= 60);

        const Nilai = 78;
        let kategori;
        if (Nilai >= 85) {
            kategori = "A";
        } else if (Nilai >= 70) {
            kategori = "B";
        } else if (Nilai >= 60) {
            kategori = "C";
        } else {
            kategori = "D";
        }

        console.log("Nilai:", Nilai);
        console.log("Kategori:", kategori);

        function hitungdiskon(harga, persen) {
            return harga - (harga * persen / 100);
        }

        for (let i = 0; i <= 3; i++) {
            const harga = 1 * 10000
            const bayar = hitungdiskon(harga, 10);
            console.log("Barang", i, "Harga:", harga, "Bayar:", bayar);
        }

        const namaMahasiswa = "Zidane Hafizh Ali";
        const nilaiTugas = 80;
        const nilaiUTS = 90;
        const nilaiUAS = 85;

        const nilaiAkhir = (nilaiTugas * 0.3) + (nilaiUTS * 0.3) + (nilaiUAS * 0.4);

        let status;
            if (nilaiAkhir >= 60) {
            status = "LULUS";
        } else {
            status = "TIDAK LULUS";
        }

        console.log("Nama Mahasiswa : " + namaMahasiswa);
        console.log("Nilai Akhir    : " + nilaiAkhir);
        console.log("Status         : " + status);
    </script>
</body>
</html>
